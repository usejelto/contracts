# Portable workflow: this component directory must be the repository root.
name: contracts checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      conformance:
        description: Run full conformance using the checked-in contracts pin
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  GOFLAGS: -mod=readonly
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # make check scans the whole Git history for secrets.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The same command a contributor runs: tests, packages, the security
      # scans and conformance twice. The scanners do not depend on the
      # platform, so the other rows repeat only the platform-sensitive part.
      - name: Checks
        if: runner.os == 'Linux'
        run: make check
      - name: Component tests, packages and Go vulnerability check
        if: runner.os != 'Linux'
        run: make test build package govulncheck
      - name: Conformance twice
        if: runner.os != 'Linux'
        run: make conformance-twice

      - name: Prepare release artifacts
        if: inputs.release
        run: |
          python3 release.py stage
          python3 release.py smoke
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: release-${{ runner.os }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release }}
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/
            dist/*.zip
            dist/*.sha256
            *.tgz
          if-no-files-found: error
          retention-days: 14
