name: Bug report
description: Report a reproducible problem with Jelto contracts.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security or privacy vulnerabilities,
        email taha@jelto.io privately; do not post the details here.
        Use synthetic examples and redact logs: no credentials, customer data or IP addresses.
        See our [Code of Conduct](https://github.com/usejelto/contracts/blob/main/CODE_OF_CONDUCT.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which package version or source commit is affected?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, runtime or toolchain version, and framework if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a small synthetic example and the commands or steps to run it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or additional context
      description: Optional error output, screenshots, or related issues. Remove private data first.
