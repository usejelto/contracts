version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']
    # A release must be a week old before it is proposed, so a compromised
    # version is usually withdrawn before it can reach this repository.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
  # The two direct Go dependencies (the JSON Schema validator and yaml.v3).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      go:
        patterns: ['*']
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
