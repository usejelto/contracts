  # User-triggered text-to-speech is neither search indexing nor an AI-answer request.
  - { needle: google-read-aloud,      operator: Google,            category: other }
  # Browser-shaped: these carry a real Chrome/Safari token, so browser_markers waves them
  # through and the human filter counts them as visitors until a needle names them (F27).
  - { needle: google favicon,         operator: Google,            category: indexing }
  - { needle: google web preview,     operator: Google,            category: indexing }
  # GoogleOther spans product/R&D crawling; the request does not establish its purpose.
  - { needle: googleother,            operator: Google,            category: other }
  # Extended tokens are robots.txt reuse controls, not separate HTTP crawlers. Retain only
  # literal claimed-UA detection; never infer a training visit from either control.
  - { needle: google-extended,        operator: Google,            category: other }
