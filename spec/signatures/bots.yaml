# spec/signatures/bots.yaml — automated-client classification, applied ON READ.
# Status: v0.8 · Gates: M1 · Seeded from EQBase's stats-worker (2026-08), which classified live
# traffic for four months. To name a new bot: read the user agents on the Ops card's Bots row
# (`sample_uas`, up to five per row — the account API caps it), add ONE line.
#
# Upstream: none. This table is HAND-CURATED and has no generator. Its reference — what a new
#           needle is checked against, not imported from — is matomo-org/device-detector's bot
#           regexes as shipped in Plausible's ua_inspector release 6.5.0
#           (priv/ua_inspector/bot.bots.yml, 807 regexes).
# Pinned:   device-detector via ua_inspector 6.5.0 · last checked against it 2026-08-30.
# Refresh:  make signatures  (prints this pin and regenerates nothing here). Importing 807
#           regexes is the move this file exists to refuse: the Ops card is actionable only
#           because every row carries an operator a customer recognises, and it is read on a
#           column whose rows cannot be reclassified backwards if the import is wrong. Add ONE
#           line, for a user agent someone has actually seen.
#
# Matching: lower-case substring of the user agent; FIRST MATCH WINS, so a specific token
# (chatgpt-user) must precede a broader one it contains (chatgpt). The engine emits `needles`
# in file order into multiSearchFirstIndex(); index 0 = no match = human (subject to §rules).
# multiMatchAnyIndex() MUST NOT be used: it returns an unspecified matching index, not the first.
# Ceiling: 256 needles per array (signatures + generic_tokens). The loader refuses to start above
# it; past 256, chunk in file order and cascade — spec/metrics.md §6.
# Both properties are verified on ClickHouse 24.8.14, not documented (the docs say leftmost match
# in the haystack). Re-test on upgrade; a change renames an operator, it does not move a count.
# Lower case: needles are compared against lower(ua) VERBATIM — nothing lower-cases this file —
# so a needle with a capital letter matches nothing, forever, and says nothing. The loader
# refuses to start on one, the same as the ceiling. Write every needle in lower case.
#
# AI coverage checked 2026-09-05 against datafa.st/crawlers and @datafast/ai-crawl 1.0.9;
# current Google, Mistral, Amazon, Kimi, Apple and Cohere documentation governs purpose.
# Accepted purposes and source evidence: spec/fixtures/crawlers/expected.md
# under Named crawler classification; spec/advanced-features.md §4 owns the policy.
# These are claimed UA identities, not verified operators or proof of downstream content use.
# Keep known AI crawlers with unsupported purposes as `ai_other`, and other clients as
# `other`. Do not add bare Grok (also matches ngrok), Copilot
# (also names browser/app products), or broad provider aliases such as gemini, kimi or xai.
#
# AI visibility categories used by the Bots card: ai_answers · indexing · training · ai_other.
# ai_other names an AI crawler without claiming its requests serve a specific purpose.
# Other automated clients retain their operational categories below; they are
# still excluded from human metrics, but the AI visibility card does not mix
# monitoring, SEO tooling, link unfurlers, and generic scripts into its totals.

rules:
  empty_ua: { operator: "Empty user agent", category: other }
  # A package manager installs for a real person: NOT a bot. Checked as a UA PREFIX before the
  # table (Homebrew's UA ends in "curl/8.x" and would otherwise match the curl line).
  installers:
    - { prefix: "homebrew/", label: Homebrew }
    - { prefix: "winget-cli/", label: winget }
  # Applied after the table: a generic bot token wins even inside a browser-looking UA.
  generic_tokens: [bot, crawler, spider, crawl, slurp, scanner, fetcher, http-client, httpclient]
  generic: { operator: "Other bot/crawler", category: other }
  # A UA that matched nothing and does not look like a browser is an unidentified client.
  browser_markers:
    all_of: ["mozilla/"]
    any_of: [safari, gecko, chrome, applewebkit, firefox]
  unidentified: { operator: "Unidentified automated client", category: other }

