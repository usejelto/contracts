c: C3
title: one heartbeat per UTC day, whatever a process does
implements: spec/sdk-conformance.md §4 C3
notes: |
  The first init queues its install immediately alongside the heartbeat. The
  first 3 000 ms advance delivers and claims it; subsequent launches retain
  that claim. The assertions count heartbeats across two UTC days, with the
  install sharing the first request, so the three launches need no preamble.
arms:
  - name: three launches over two days
    env: {JELTO_NOW: "1788134400000"}
    steps:
      - run: [init prd_conform001, sleep 3000]
      - restart: {env: {JELTO_NOW: "1788220800000"}}
      - run: [init prd_conform001, sleep 3000]
      - restart: {env: {JELTO_NOW: "1788220800000"}}
      - run: [init prd_conform001, sleep 3000]
    assert:
      - {check: event_names, counts: {heartbeat: 2}, why: "one per UTC day; the third init on day two sends none"}
      - {check: request_count, equal: 2}
