c: C23
title: first version baseline and same-day opaque changes, repeats and downgrades
implements: spec/sdk-conformance.md §7
arms:
  - name: baseline, change, unchanged, downgrade, return
    env: {JELTO_NOW: "1788134400000", JELTO_APP_VERSION: "release-Z"}
    steps:
      - run: [init prd_conform001, sleep 25200000, installid]
      - restart: {env: {JELTO_NOW: "1788159600000", JELTO_APP_VERSION: "build-A+2"}}
      - run: [init prd_conform001, init prd_conform001, sleep 3000, installid]
      - restart: {env: {JELTO_APP_VERSION: "build-A+2"}}
      - run: [init prd_conform001, sleep 3000]
      - restart: {env: {JELTO_APP_VERSION: "release-Z"}}
      - run: [init prd_conform001, sleep 3000]
      - restart: {env: {JELTO_APP_VERSION: "build-A+2"}}
      - run: [init prd_conform001, sleep 3000, installid]
    assert:
      - {check: event_names, counts: {heartbeat: 1, install: 1, app_updated: 3}}
      - {check: app_updates, values: ["release-Z=>build-A+2", "build-A+2=>release-Z", "release-Z=>build-A+2"]}
      - {check: host_reply_stable, key: installid}
      - {check: state, path: last_app_version, value: '"build-A+2"'}
      - {check: state, path: install_claimed, value: "true"}
